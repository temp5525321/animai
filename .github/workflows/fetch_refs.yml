name: AI 드라마·광고 레퍼런스 수집

on:
  schedule:
    # KST 오후 6시 (UTC 9시). 할당량 리셋(KST 오후 5시) 직후라 하루치를 온전히 쓴다.
    - cron: '0 9 * * *'
  workflow_dispatch:
    # ★실험용 손잡이. 기본값은 싸게(1페이지·댓글끔) → 하루에 여러 번 돌릴 수 있다.
    #   할당량을 먹는 건 (키워드 수 × 페이지 수) 뿐. 검색 기간은 비용과 무관.
    inputs:
      pages:
        description: '키워드당 페이지 수 (1=50개·100유닛)'
        default: '1'
      months:
        description: '검색 기간(개월) — 비용에 영향 없음'
        default: '6'
      comment_top:
        description: '갈래별 상위 몇 개에 댓글 분석 (0=끔, 영상당 1유닛)'
        default: '0'
      dry_run:
        description: '1이면 저장하지 않고 결과만 확인'
        default: '0'

jobs:
  fetch-refs:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests

      - name: 레퍼런스 수집
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_API_KEY_TEST: ${{ secrets.YOUTUBE_API_KEY_TEST }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # service_role 키가 있으면 조회수 갱신(upsert)까지 동작. 없으면 insert-only.
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # 수동 실행이면 입력값을, 스케줄 실행이면 본수집 설정을 쓴다
          REFS_PAGES: ${{ inputs.pages || '2' }}
          REFS_MONTHS: ${{ inputs.months || '6' }}
          REFS_COMMENT_TOP: ${{ inputs.comment_top || '100' }}
          REFS_DRY_RUN: ${{ inputs.dry_run || '0' }}
        run: python fetch_refs.py
