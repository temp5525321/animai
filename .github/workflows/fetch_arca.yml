name: 아카라이브 Ai영상 자동 수집

on:
  schedule:
    - cron: '30 21 * * *'  # KST 오전 6시 30분 (UTC 21:30)
    - cron: '30 9 * * *'   # KST 오후 6시 30분 (UTC 9:30)
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  fetch-arca:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests beautifulsoup4

      - name: 아카라이브 영상 수집
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python fetch_arca.py
